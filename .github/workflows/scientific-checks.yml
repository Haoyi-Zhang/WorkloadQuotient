name: Scientific checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-reproduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run the bounded finite reproduction from the flat artifact root
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p064-scientific-raw"
          ulimit -v 2621440
          ulimit -t 240
          timeout --signal=TERM --kill-after=5s 310s \
            python -B reproduce.py \
              --output "$RUNNER_TEMP/p064-scientific-raw/reproduction" \
            2>&1 | tee "$RUNNER_TEMP/p064-scientific-raw/whole-run.log"
      - name: Upload raw outputs, including failed or interrupted attempts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p064-scientific-raw
          path: ${{ runner.temp }}/p064-scientific-raw/
          if-no-files-found: error
          retention-days: 14
